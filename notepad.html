<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background: transparent;
                overflow: hidden;
            }

            .box {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                background: rgba(30, 30, 30, 0.55);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                color: white;
                font-family: sans-serif;
                padding: 16px;
            }

            #notes {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                background: transparent;
                color: white;
                font-family: sans-serif;
                font-size: 14px;
                border: none;
                outline: none;
                resize: none;
            }
        </style>
    </head>
    <body>
        <div class = "box">
            <textarea id = "notes" placeholder = "Jot something down..."></textarea>
        </div>

        <script src = "notepad-renderer.js"></script>
    </body>
</html>
