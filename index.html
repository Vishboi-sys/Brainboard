<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                background: transparent;
                overflow: hidden;
            }

            .panel {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                background: rgba(30, 30, 30, 1);
                border-radius: 12px;
                color: white;
                font-family: sans-serif;
                padding: 16px;
            }

            #query {
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                font-size: 16px;
                border-radius: 6px;
                border: none;
                outline: none;
            }

            #results {
                margin-top: 10px;
            }

        </style>
    </head>
    <body>
        <div class = "panel">
            <input id = "query" type = "text" placeholder = "Enter a query..." autofocus />
            <div id = "results"></div>
        </div>

        <script src = "renderer.js"></script>
    </body>
</html>
