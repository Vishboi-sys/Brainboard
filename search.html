<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                background: transparent;
                overflow: hidden;
            }

            #query {
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                font-size: 16px;
                border-radius: 6px;
                border: none;
                outline: none;
                background: rgba(30, 30, 30, 0.55);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                color: white;
            }
        </style>
    </head>
    <body>
        <input id ="query" type = "text" placeholder = "Enter a query..." autofocus />

        <script src = "search-renderer.js"></script>
    </body>
</html>
