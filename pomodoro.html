<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background: transparent; 
                overflow: hidden;
            }

            .box {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                background: rgba(30, 30, 30, 1);
                border-radius: 12px;
                color: white;
                font-family: sans-serif;
                padding: 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #time-display {
                font-size: 36px;
                margin-bottom: 10px;
            }

            #start-pause-button {
                padding: 8px 16px;
                font-size: 14px;
                border-radius: 6px;
                border: none;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class = "box">
            <div id = "time-display">25:00</div>
            <button id = "start-pause-button">Start</button>
        </div>

        <script src = "pomodoro-renderer.js"></script>
    </body>
</html>
