<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                background: transparent;
                overflow: hidden;
            }

            .box {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                background: rgba(30, 30, 30, 1);
                border-radius: 12px;
                color: white;
                font-family: sans-serif;
                padding: 16px;
            }

            #todo-input {
                width: 100%;
                box-sizing: border-box;
                padding: 8px;
                font-size: 14px;
                border-radius: 6px;
                border: none;
                outline: none;
                margin-bottom: 8px;
            }
        </style>
    </head>
    <body>
        <div class = "box">
            <input id = "todo-input" type = "text" placeholder = "Add a task..." />
            <div id = "todo-results"></div>
        </div>
        <script src = "todo-renderer.js"></script>
    </body>
</html>
